<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Segnalazione Guasti Cinema</title>
  <style>
    :root {
      --primary-color: #0056b3;
      --primary-hover: #004085;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --border-color: #cccccc;
      --text-color: #333333;
      --muted-color: #666666;
    }

    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 750px;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      margin-top: 0;
      color: var(--primary-color);
      font-size: 1.8rem;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }

    select, input[type="text"], input[type="datetime-local"], textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.95rem;
      background-color: #fff;
    }

    input[readonly] {
      background-color: #e9ecef;
      color: #495057;
      cursor: not-allowed;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    /* Contenitore Selezione Sale */
    .screens-card {
      border: 1px solid #b8daff;
      background-color: #f8f9fa;
      border-radius: 8px;
      padding: 15px;
      margin-top: 10px;
    }

    .screens-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #dee2e6;
      padding-bottom: 10px;
      margin-bottom: 10px;
    }

    .screens-header h4 {
      margin: 0;
      color: var(--primary-color);
    }

    .badge-seats {
      background-color: #0056b3;
      color: white;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .screen-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px;
      border-radius: 4px;
      transition: background 0.15s;
    }

    .screen-row:hover {
      background-color: #e2e6ea;
    }

    .screen-row label {
      font-weight: normal;
      margin: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .screen-seats-count {
      color: var(--muted-color);
      font-size: 0.9rem;
      font-weight: 500;
    }

    .divider {
      border-top: 1px dashed #ccc;
      margin: 8px 0;
    }

    .special-option {
      font-weight: bold;
    }

    .special-option-none {
      color: #dc3545;
    }

    button.btn-submit {
      width: 100%;
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 10px;
    }

    button.btn-submit:hover {
      background-color: var(--primary-hover);
    }

    .alert {
      padding: 12px 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      display: none;
    }

    .alert-success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .alert-danger {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Report Guasti Cinema</h1>

  <div id="alert-box" class="alert"></div>

  <form id="incident-form">

    <!-- Cinema e Dati Generali -->
    <div class="form-group">
      <label for="cinema">Cinema *</label>
      <select id="cinema" name="cinema" required onchange="onCinemaSelected()">
        <option value="">-- Seleziona Cinema --</option>
      </select>
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label for="area">Area</label>
        <input type="text" id="area" name="area" readonly placeholder="Auto-compilato">
      </div>
      <div class="form-group">
        <label for="totalCinemaCapacity">Capienza Totale Cinema</label>
        <input type="text" id="totalCinemaCapacity" name="totalCinemaCapacity" readonly placeholder="Auto-compilato">
      </div>
    </div>

    <!-- Sezione Sale Impattate Dinamica -->
    <div class="form-group">
      <label>Numero Sala Impattata *</label>
      
      <div id="screens-wrapper" class="screens-card" style="display: none;">
        <div class="screens-header">
          <h4>Seleziona le Sale Interessate</h4>
          <span class="badge-seats">Posti Impattati: <span id="display-total-seats">0</span></span>
        </div>

        <!-- Elenco dinamico sale -->
        <div id="screens-list-container"></div>
      </div>
      
      <!-- Input nascosti/inviati al server -->
      <input type="hidden" id="impactedScreens" name="impactedScreens" required>
      <input type="hidden" id="impactedCapacity" name="impactedCapacity" value="0">
    </div>

    <!-- Responsabilità e Causale -->
    <div class="grid-2">
      <div class="form-group">
        <label for="responsibility">Responsabilità del Guasto *</label>
        <select id="responsibility" name="responsibility" required>
          <option value="">-- Seleziona --</option>
        </select>
      </div>

      <div class="form-group">
        <label for="reason">Causale *</label>
        <select id="reason" name="reason" required>
          <option value="">-- Seleziona --</option>
        </select>
      </div>
    </div>

    <!-- Date Inizio e Chiusura -->
    <div class="grid-2">
      <div class="form-group">
        <label for="startTimestamp">Data / Ora Inizio Guasto *</label>
        <input type="datetime-local" id="startTimestamp" name="startTimestamp" required>
      </div>

      <div class="form-group">
        <label for="endTimestamp">Data / Ora Risoluzione</label>
        <input type="datetime-local" id="endTimestamp" name="endTimestamp">
      </div>
    </div>

    <!-- Dettagli guasto -->
    <div class="form-group">
      <label for="description">Descrizione del Guasto *</label>
      <textarea id="description" name="description" rows="3" required placeholder="Inserisci i dettagli del problema riscontrato..."></textarea>
    </div>

    <div class="form-group">
      <label for="notes">Note / Azioni Intraprese</label>
      <textarea id="notes" name="notes" rows="2" placeholder="Eventuali note integrative o interventi già eseguiti..."></textarea>
    </div>

    <button type="submit" class="btn-submit">Invia Segnalazione</button>
  </form>
</div>

<script>
  // Inserisci qui l'URL del tuo Web App Google Apps Script se attivo
  const SCRIPT_URL = "YOUR_GOOGLE_APPS_SCRIPT_URL_HERE";

  let optionsData = null;

  // Caricamento Opzioni da options.json
  window.addEventListener('DOMContentLoaded', () => {
    fetch('options.json')
      .then(res => res.json())
      .then(data => {
        optionsData = data;
        populateDropdowns();
      })
      .catch(err => {
        console.error("Errore nel caricamento del file options.json:", err);
        showAlert("Impossibile caricare le opzioni. Assicurati che options.json sia presente.", "danger");
      });
  });

  function populateDropdowns() {
    if (!optionsData) return;

    // Popola Cinema
    const cinemaSelect = document.getElementById('cinema');
    optionsData.cinemas.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.name;
      opt.textContent = c.name;
      cinemaSelect.appendChild(opt);
    });

    // Popola Responsabilità
    const respSelect = document.getElementById('responsibility');
    optionsData.responsibilities.forEach(r => {
      const opt = document.createElement('option');
      opt.value = r;
      opt.textContent = r;
      respSelect.appendChild(opt);
    });

    // Popola Causali
    const reasonSelect = document.getElementById('reason');
    optionsData.reasons.forEach(r => {
      const opt = document.createElement('option');
      opt.value = r;
      opt.textContent = r;
      reasonSelect.appendChild(opt);
    });
  }

  // Cambio del cinema selezionato
  function onCinemaSelected() {
    const selectedName = document.getElementById('cinema').value;
    const screensWrapper = document.getElementById('screens-wrapper');
    const container = document.getElementById('screens-list-container');
    const areaInput = document.getElementById('area');
    const capInput = document.getElementById('totalCinemaCapacity');

    if (!selectedName || !optionsData) {
      screensWrapper.style.display = 'none';
      areaInput.value = '';
      capInput.value = '';
      resetSeatsCalculations();
      return;
    }

    const cinemaObj = optionsData.cinemas.find(c => c.name === selectedName);
    if (!cinemaObj) return;

    // Compila info cinema
    areaInput.value = cinemaObj.area || '';
    capInput.value = cinemaObj.capacity ? `${cinemaObj.capacity} posti` : '';

    // Costruisci lista sale
    container.innerHTML = '';
    screensWrapper.style.display = 'block';

    // 1. Sale Singole
    cinemaObj.screens.forEach((screen, idx) => {
      const row = document.createElement('div');
      row.className = 'screen-row';
      row.innerHTML = `
        <label>
          <input type="checkbox" class="chk-screen" data-capacity="${screen.seats}" value="${screen.name}" onchange="onSingleScreenChange()">
          <span>${screen.name}</span>
        </label>
        <span class="screen-seats-count">${screen.seats} posti</span>
      `;
      container.appendChild(row);
    });

    // Separatore
    const divider = document.createElement('div');
    divider.className = 'divider';
    container.appendChild(divider);

    // 2. Opzione "Tutte"
    const rowAll = document.createElement('div');
    rowAll.className = 'screen-row special-option';
    rowAll.innerHTML = `
      <label>
        <input type="checkbox" id="chk-all" onchange="toggleAllScreens(this.checked)">
        <span>Tutte</span>
      </label>
      <span class="screen-seats-count">${cinemaObj.capacity} posti</span>
    `;
    container.appendChild(rowAll);

    // 3. Opzione "Nessuna"
    const rowNone = document.createElement('div');
    rowNone.className = 'screen-row special-option special-option-none';
    rowNone.innerHTML = `
      <label>
        <input type="checkbox" id="chk-none" onchange="toggleNoScreens(this.checked)">
        <span>Nessuna</span>
      </label>
      <span class="screen-seats-count">0 posti</span>
    `;
    container.appendChild(rowNone);

    resetSeatsCalculations();
  }

  // Gestione spunta singola sala
  function onSingleScreenChange() {
    const screenBoxes = Array.from(document.querySelectorAll('.chk-screen'));
    const chkAll = document.getElementById('chk-all');
    const chkNone = document.getElementById('chk-none');

    const allChecked = screenBoxes.length > 0 && screenBoxes.every(cb => cb.checked);
    const noneChecked = screenBoxes.every(cb => !cb.checked);

    if (chkAll) chkAll.checked = allChecked;
    if (chkNone) chkNone.checked = noneChecked;

    calculateTotals();
  }

  // Gestione spunta "Tutte"
  function toggleAllScreens(isChecked) {
    const screenBoxes = document.querySelectorAll('.chk-screen');
    const chkNone = document.getElementById('chk-none');

    if (chkNone) chkNone.checked = false;
    screenBoxes.forEach(cb => cb.checked = isChecked);

    calculateTotals();
  }

  // Gestione spunta "Nessuna"
  function toggleNoScreens(isChecked) {
    const screenBoxes = document.querySelectorAll('.chk-screen');
    const chkAll = document.getElementById('chk-all');

    if (chkAll) chkAll.checked = false;
    if (isChecked) {
      screenBoxes.forEach(cb => cb.checked = false);
    }

    calculateTotals();
  }

  // Calcolo e aggiornamento totali
  function calculateTotals() {
    const screenBoxes = Array.from(document.querySelectorAll('.chk-screen'));
    const chkAll = document.getElementById('chk-all');
    const chkNone = document.getElementById('chk-none');

    let totalSeats = 0;
    let selectedNames = [];

    if (chkAll && chkAll.checked) {
      selectedNames = ["Tutte"];
      screenBoxes.forEach(cb => totalSeats += parseInt(cb.dataset.capacity || 0, 10));
    } else if (chkNone && chkNone.checked) {
      selectedNames = ["Nessuna"];
      totalSeats = 0;
    } else {
      screenBoxes.forEach(cb => {
        if (cb.checked) {
          totalSeats += parseInt(cb.dataset.capacity || 0, 10);
          selectedNames.push(cb.value);
        }
      });
    }

    // Aggiorna interfaccia e campi nascosti
    document.getElementById('display-total-seats').innerText = totalSeats;
    document.getElementById('impactedCapacity').value = totalSeats;
    document.getElementById('impactedScreens').value = selectedNames.join(', ');
  }

  function resetSeatsCalculations() {
    document.getElementById('display-total-seats').innerText = '0';
    document.getElementById('impactedCapacity').value = '0';
    document.getElementById('impactedScreens').value = '';
  }

  // Invio Form
  document.getElementById('incident-form').addEventListener('submit', (e) => {
    e.preventDefault();

    const impactedValue = document.getElementById('impactedScreens').value;
    if (!impactedValue) {
      showAlert("Seleziona almeno una sala, oppure 'Tutte' / 'Nessuna'.", "danger");
      return;
    }

    const formData = new FormData(e.target);
    const data = Object.fromEntries(formData.entries());

    // Esempio Invio
    if (SCRIPT_URL && SCRIPT_URL !== "YOUR_GOOGLE_APPS_SCRIPT_URL_HERE") {
      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      .then(() => {
        showAlert("Segnalazione inviata con successo!", "success");
        e.target.reset();
        onCinemaSelected();
      })
      .catch(err => {
        showAlert("Errore durante l'invio della segnalazione.", "danger");
        console.error(err);
      });
    } else {
      console.log("Dati del form da inviare:", data);
      showAlert("Form compilato correttamente! (Imposta SCRIPT_URL per l'invio su Google Sheets)", "success");
    }
  });

  function showAlert(message, type) {
    const alertBox = document.getElementById('alert-box');
    alertBox.className = `alert alert-${type}`;
    alertBox.innerText = message;
    alertBox.style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script>
</body>
</html>
