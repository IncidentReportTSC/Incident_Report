<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Incident Report System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #loginCard {
      max-width: 420px;
      margin: 80px auto;
      border: none;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }
    .card-header-custom {
      background-color: #8a0e88;
      color: white;
      text-align: center;
      padding: 1.5rem;
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
    }
    .btn-custom {
      background-color: #8a0e88;
      color: white;
    }
    .btn-custom:hover {
      background-color: #6b0b6a;
      color: white;
    }
    .password-container {
      position: relative;
    }
    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      user-select: none;
      font-size: 1.1rem;
    }
    .hidden { display: none !important; }
    .screens-container {
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid #ced4da;
      padding: 10px;
      border-radius: 6px;
      background-color: #fff;
    }
    .status-aperto {
      color: #198754;
      font-weight: bold;
    }
    .status-chiuso {
      color: #dc3545;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- SCHERMATA DI LOGIN -->
  <div id="loginSection" class="container">
    <div class="card" id="loginCard">
      <div class="card-header-custom">
        <h4 class="mb-0">📹 Accesso Incident Report</h4>
      </div>
      <div class="card-body p-4">
        <form id="loginForm" onsubmit="event.preventDefault(); eseguiLogin();">
          
          <div class="mb-3">
            <label for="loginUser" class="form-label"><strong>Nome Utente / Cinema</strong></label>
            <select id="loginUser" class="form-select" required>
              <option value="">Caricamento utenti in corso...</option>
            </select>
          </div>

          <div class="mb-4">
            <label for="loginPass" class="form-label"><strong>Password</strong></label>
            <div class="password-container">
              <input type="password" id="loginPass" class="form-control" placeholder="Inserisci password" required>
              <span class="toggle-password" onclick="togglePasswordVisibility()">👁️</span>
            </div>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-custom btn-lg" id="btnLogin">ACCEDI</button>
          </div>

          <p id="loginMessage" class="text-center mt-3 fw-bold"></p>
        </form>
      </div>
    </div>
  </div>

  <!-- SCHERMATA PRINCIPALE (Form Incident) -->
  <div id="appSection" class="container py-4 hidden">
    <div class="d-flex justify-content-between align-items-center mb-4 p-3 bg-white rounded shadow-sm">
      <div>
        <span>Benvenuto, <strong id="lblUtente">-</strong> (<span id="lblRuolo">-</span>)</span>
      </div>
      <button class="btn btn-outline-danger btn-sm" onclick="logout()">Logout</button>
    </div>

    <div class="card p-4 shadow-sm">
      <h3 class="text-primary mb-3">Compilazione Incident Report</h3>
      <form id="incidentForm" onsubmit="event.preventDefault(); salvaReport();">
        
        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label">Cinema</label>
            <select id="selCinema" class="form-select" required onchange="aggiornaDatiCinema()">
              <option value="">-- Seleziona Cinema --</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">N. Schermi Totali</label>
            <input type="text" id="txtScreens" class="form-control" readonly>
          </div>
          <div class="col-md-3">
            <label class="form-label">Capacità Totale</label>
            <input type="text" id="txtCapacity" class="form-control" readonly>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label">Area</label>
            <input type="text" id="txtArea" class="form-control" readonly>
          </div>
          <div class="col-md-6">
            <label class="form-label d-flex justify-content-between align-items-center">
              <span>Seleziona Sala/e Interessata/e</span>
              <div>
                <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-1 me-1" onclick="selezionaTutteSale(true)">All</button>
                <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-1" onclick="selezionaTutteSale(false)">Nessuna</button>
              </div>
            </label>
            <div id="screensCheckboxes" class="screens-container">
              <span class="text-muted">Seleziona prima un cinema...</span>
            </div>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label">Responsabilità</label>
            <select id="selResponsibility" class="form-select" required>
              <option value="">-- Seleziona --</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Motivazione</label>
            <select id="selReason" class="form-select" required>
              <option value="">-- Seleziona --</option>
            </select>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-md-3">
            <label class="form-label">Numero di Riferimento</label>
            <input type="text" id="txtReference" class="form-control" placeholder="Es. Ticket o Rif.">
          </div>
          <div class="col-md-3">
            <label class="form-label">Compilatore</label>
            <input type="text" id="txtCompiler" class="form-control" placeholder="Nome compilatore">
          </div>
          <div class="col-md-3">
            <label class="form-label">Status</label>
            <select id="selStatus" class="form-select" required onchange="aggiornaColoreStatus()">
              <option value="Aperto">Aperto</option>
              <option value="Chiuso">Chiuso</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Data Apertura</label>
            <input type="date" id="txtOpeningDate" class="form-control" required>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label">Data Probabile Chiusura</label>
            <input type="date" id="txtExpectedClosingDate" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label">Data Chiusura Effettiva</label>
            <input type="date" id="txtActualClosingDate" class="form-control">
          </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Azioni Intraprese</label>
            <textarea id="txtActions" class="form-control" rows="2" placeholder="Azioni correttive messe in campo..."></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Commenti / Descrizione</label>
            <textarea id="txtComments" class="form-control" rows="3" placeholder="Dettagli dell'incidente..."></textarea>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-custom btn-lg" id="btnSave">Salva Report</button>
        </div>
        <p id="saveMessage" class="text-center mt-3 fw-bold"></p>
      </form>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby5dF18ViUJoaXLGtozEsZ0pd2J5Gc65Kr_QEjPdv8yDe9UPboij0GzRwQ_1DUTLRZI/exec";

    let currentUser = null;
    let globalOptions = null;

  async function caricaListaUtenti() {
      const selectUser = document.getElementById('loginUser');
      try {
        // Usiamo un trucchetto con mode: 'no-cors' o un fetch diretto gestendo il testo
        const response = await fetch(SCRIPT_URL, { redirect: "follow" });
        const textData = await response.text();
        const data = JSON.parse(textData);
        
        if (data.options) {
          globalOptions = data.options;
          popolaCampiForm();
        }

        selectUser.innerHTML = '<option value="">-- Seleziona Utente / Cinema --</option>';
        if (data.users && data.users.length > 0) {
          data.users.forEach(user => {
            const opt = document.createElement('option');
            opt.value = user;
            opt.textContent = user;
            selectUser.appendChild(opt);
          });
        }
      } catch (err) {
        console.error("Errore nel caricamento:", err);
        // Fallback di emergenza diretto se la chiamata fetch viene bloccata dal browser in locale
        selectUser.innerHTML = `
          <option value="">-- Seleziona Utente / Cinema --</option>
          <option value="admin">admin</option>
          <option value="TSC Beinasco (TO)">TSC Beinasco (TO)</option>
        `;
        globalOptions = {
          cinemas: [{ name: "TSC Beinasco (TO)", screens: 9, capacity: 2410, area: "AREA 1" }],
          responsibilities: ["Manutenzione", "Pulizia", "Operation", "IT", "Direzione"],
          reasons: ["Guasto Impianto", "Problema Tecnico", "Segnalazione Cliente", "Routine"]
        };
        popolaCampiForm();
      }
    }

    function popolaCampiForm() {
      if (!globalOptions) return;
      
      const selCinema = document.getElementById('selCinema');
      selCinema.innerHTML = '<option value="">-- Seleziona Cinema --</option>';
      globalOptions.cinemas.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.name;
        opt.textContent = c.name;
        selCinema.appendChild(opt);
      });

      const selResp = document.getElementById('selResponsibility');
      selResp.innerHTML = '<option value="">-- Seleziona --</option>';
      globalOptions.responsibilities.forEach(r => {
        const opt = document.createElement('option');
        opt.value = r;
        opt.textContent = r;
        selResp.appendChild(opt);
      });

      const selReason = document.getElementById('selReason');
      selReason.innerHTML = '<option value="">-- Seleziona --</option>';
      globalOptions.reasons.forEach(reason => {
        const opt = document.createElement('option');
        opt.value = reason;
        opt.textContent = reason;
        selReason.appendChild(opt);
      });

      const oggi = new Date().toISOString().split('T')[0];
      const openingInput = document.getElementById('txtOpeningDate');
      if (openingInput && !openingInput.value) {
        openingInput.value = oggi;
      }

      if (currentUser && !document.getElementById('txtCompiler').value) {
        document.getElementById('txtCompiler').value = currentUser.username;
      }

      aggiornaColoreStatus();
    }

    function aggiornaColoreStatus() {
      const selectStatus = document.getElementById('selStatus');
      selectStatus.className = "form-select ";
      if (selectStatus.value === "Aperto") {
        selectStatus.classList.add("status-aperto");
      } else {
        selectStatus.classList.add("status-chiuso");
      }
    }

    function aggiornaDatiCinema() {
      const nomeCinema = document.getElementById('selCinema').value;
      const container = document.getElementById('screensCheckboxes');
      
      if (!globalOptions || !nomeCinema) {
        document.getElementById('txtScreens').value = '';
        document.getElementById('txtCapacity').value = '';
        document.getElementById('txtArea').value = '';
        container.innerHTML = '<span class="text-muted">Seleziona prima un cinema...</span>';
        return;
      }

      const cinemaObj = globalOptions.cinemas.find(c => c.name === nomeCinema);
      if (cinemaObj) {
        document.getElementById('txtScreens').value = cinemaObj.screens;
        document.getElementById('txtCapacity').value = cinemaObj.capacity;
        document.getElementById('txtArea').value = cinemaObj.area;

        container.innerHTML = '';
        const numSchermi = parseInt(cinemaObj.screens) || 0;
        
        if (numSchermi > 0) {
          let postiMedioPerSala = Math.round((parseInt(cinemaObj.capacity) || 0) / numSchermi);

          for (let i = 1; i <= numSchermi; i++) {
            let postiSala = "";
            if (cinemaObj.rooms && cinemaObj.rooms[i - 1] && cinemaObj.rooms[i - 1].seats) {
              postiSala = ` (${cinemaObj.rooms[i - 1].seats} posti)`;
            } else if (postiMedioPerSala > 0) {
              postiSala = ` (~${postiMedioPerSala} posti)`;
            }

            const div = document.createElement('div');
            div.className = 'form-check mb-2';
            
            div.innerHTML = `
              <input class="form-check-input screen-checkbox" type="checkbox" value="Sala ${i}${postiSala}" id="chkSala${i}">
              <label class="form-check-label" for="chkSala${i}">
                <strong>Sala ${i}</strong> ${postiSala}
              </label>
            `;
            container.appendChild(div);
          }
        } else {
          container.innerHTML = '<span class="text-muted">Nessuna sala disponibile</span>';
        }
      }
    }

    function selezionaTutteSale(seleziona) {
      document.querySelectorAll('.screen-checkbox').forEach(chk => {
        chk.checked = seleziona;
      });
    }

    function togglePasswordVisibility() {
      const passInput = document.getElementById('loginPass');
      const toggleIcon = document.querySelector('.toggle-password');
      
      if (passInput.type === 'password') {
        passInput.type = 'text';
        toggleIcon.textContent = '🙈';
      } else {
        passInput.type = 'password';
        toggleIcon.textContent = '👁️';
      }
    }

    async function eseguiLogin() {
      const user = document.getElementById('loginUser').value;
      const pass = document.getElementById('loginPass').value;
      const msgEl = document.getElementById('loginMessage');
      const btn = document.getElementById('btnLogin');

      if (!user) {
        msgEl.style.color = 'red';
        msgEl.textContent = 'Seleziona un utente dal menu.';
        return;
      }

      msgEl.style.color = '#0d6efd';
      msgEl.textContent = 'Verifica in corso...';
      btn.disabled = true;

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            action: 'login',
            username: user,
            password: pass
          })
        });

        const res = await response.json();

        if (res.success) {
          currentUser = res;
          msgEl.style.color = 'green';
          msgEl.textContent = 'Accesso riuscito!';
          
          setTimeout(() => {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('appSection').classList.remove('hidden');
            document.getElementById('lblUtente').textContent = currentUser.username;
            document.getElementById('lblRuolo').textContent = currentUser.ruolo;
            document.getElementById('txtCompiler').value = currentUser.username;
          }, 600);

        } else {
          msgEl.style.color = 'red';
          msgEl.textContent = res.message || 'Username o Password errati.';
        }
      } catch (error) {
        console.error("Errore login:", error);
        msgEl.style.color = 'red';
        msgEl.textContent = 'Errore di connessione. Riprova.';
      } finally {
        btn.disabled = false;
      }
    }

    async function salvaReport() {
      const msgEl = document.getElementById('saveMessage');
      const btn = document.getElementById('btnSave');
      
      const selectedScreens = [];
      document.querySelectorAll('.screen-checkbox:checked').forEach(chk => {
        selectedScreens.push(chk.value);
      });

      const reportData = {
        cinema: document.getElementById('selCinema').value,
        nScreens: document.getElementById('txtScreens').value,
        cinemaCapacity: document.getElementById('txtCapacity').value,
        area: document.getElementById('txtArea').value,
        selectedScreens: selectedScreens.join(', '),
        responsibility: document.getElementById('selResponsibility').value,
        reason: document.getElementById('selReason').value,
        referenceNumber: document.getElementById('txtReference').value,
        compiler: document.getElementById('txtCompiler').value,
        status: document.getElementById('selStatus').value,
        openingDate: document.getElementById('txtOpeningDate').value,
        expectedClosingDate: document.getElementById('txtExpectedClosingDate').value,
        actualClosingDate: document.getElementById('txtActualClosingDate').value,
        actions: document.getElementById('txtActions').value,
        comments: document.getElementById('txtComments').value
      };

      msgEl.style.color = '#0d6efd';
      msgEl.textContent = 'Salvataggio in corso...';
      btn.disabled = true;

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            action: 'saveReport',
            reportData: reportData,
            username: currentUser.username,
            ruolo: currentUser.ruolo
          })
        });

        const res = await response.json();
        if (res.success) {
          msgEl.style.color = 'green';
          msgEl.textContent = res.message;
          document.getElementById('incidentForm').reset();
          document.getElementById('txtScreens').value = '';
          document.getElementById('txtCapacity').value = '';
          document.getElementById('txtArea').value = '';
          document.getElementById('screensCheckboxes').innerHTML = '<span class="text-muted">Seleziona prima un cinema...</span>';
          popolaCampiForm();
        } else {
          msgEl.style.color = 'red';
          msgEl.textContent = 'Errore: ' + res.message;
        }
      } catch (err) {
        console.error(err);
        msgEl.style.color = 'red';
        msgEl.textContent = 'Errore di connessione durante il salvataggio.';
      } finally {
        btn.disabled = false;
      }
    }

    function logout() {
      currentUser = null;
      document.getElementById('appSection').classList.add('hidden');
      document.getElementById('loginSection').classList.remove('hidden');
      document.getElementById('loginPass').value = '';
      document.getElementById('loginMessage').textContent = '';
    }

    document.addEventListener('DOMContentLoaded', () => {
      caricaListaUtenti();
    });
  </script>
</body>
</html>
