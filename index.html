<script>
  let appOptions = {};

  // Cambia il colore dello Screen Status in base al valore
  function updateStatusColor(selectElement) {
    selectElement.className = selectElement.value === 'Close' 
      ? 'form-select status-close' 
      : 'form-select status-open';
  }

  // Carica il file options.json
  async function loadOptions() {
    try {
      const response = await fetch('options.json');
      appOptions = await response.json();
      initForm();
    } catch (error) {
      console.error("Errore nel caricamento di options.json:", error);
    }
  }

  // Inizializza i campi con i dati di options.json
  function initForm() {
    // 1. Popola i Cinema
    const selectCinema = document.getElementById('selectCinema');
    selectCinema.innerHTML = '<option value="">Seleziona Cinema...</option>';
    if (appOptions.cinemas) {
      appOptions.cinemas.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.name;
        opt.textContent = c.name;
        selectCinema.appendChild(opt);
      });
    }

    // 2. Popola Responsabilità
    const selectResp = document.getElementById('selectResponsibility');
    selectResp.innerHTML = '<option value="">Seleziona...</option>';
    if (appOptions.responsibilities) {
      appOptions.responsibilities.forEach(r => {
        const opt = document.createElement('option');
        opt.value = r;
        opt.textContent = r;
        selectResp.appendChild(opt);
      });
    }

    // 3. Popola Motivo (Reason)
    const selectReason = document.getElementById('selectReason');
    selectReason.innerHTML = '<option value="">Seleziona Motivo...</option>';
    if (appOptions.reasons) {
      appOptions.reasons.forEach(r => {
        const opt = document.createElement('option');
        opt.value = r;
        opt.textContent = r;
        selectReason.appendChild(opt);
      });
    }
  }

  // Evento cambio Cinema: Popola dati e sale
  document.getElementById('selectCinema').addEventListener('change', function() {
    const selectedCinemaName = this.value;
    const cinemaObj = appOptions.cinemas ? appOptions.cinemas.find(c => c.name === selectedCinemaName) : null;
    
    if (cinemaObj) {
      document.getElementById('nScreens').value = cinemaObj.screens;
      document.getElementById('cinemaCapacity').value = cinemaObj.capacity;
      document.getElementById('area').value = cinemaObj.area;
      
      const selectScreen = document.getElementById('selectScreen');
      selectScreen.innerHTML = '<option value="">Seleziona Sala...</option>';
      
      // Se esiste la mappa dettagliata delle sale la usa, altrimenti genera le sale dinamiche (Sala 1 .. Sala N)
      if (appOptions.screens && appOptions.screens[selectedCinemaName]) {
        appOptions.screens[selectedCinemaName].forEach(s => {
          const opt = document.createElement('option');
          opt.value = s.screen;
          opt.textContent = `${s.screen} (${s.seats} posti)`;
          opt.dataset.seats = s.seats;
          selectScreen.appendChild(opt);
        });
      } else {
        for (let i = 1; i <= cinemaObj.screens; i++) {
          const opt = document.createElement('option');
          opt.value = `Sala ${i}`;
          opt.textContent = `Sala ${i}`;
          selectScreen.appendChild(opt);
        }
      }
    } else {
      document.getElementById('nScreens').value = '';
      document.getElementById('cinemaCapacity').value = '';
      document.getElementById('area').value = '';
      document.getElementById('selectScreen').innerHTML = '<option value="">Seleziona Sala...</option>';
    }
    document.getElementById('screenCapacity').value = '';
  });

  // Evento cambio Sala: imposta posti se disponibili
  document.getElementById('selectScreen').addEventListener('change', function() {
    const selectedOpt = this.options[this.selectedIndex];
    document.getElementById('screenCapacity').value = (selectedOpt && selectedOpt.dataset.seats) ? selectedOpt.dataset.seats : '';
  });

  // Genera Reference Number in automatico alla selezione della data
  document.getElementById('dateOriginalIssue').addEventListener('change', function() {
    if (this.value) {
      const cleanDate = this.value.replace(/-/g, '');
      const randomNum = Math.floor(1000 + Math.random() * 9000);
      document.getElementById('referenceNumber').value = `INC-${cleanDate}-${randomNum}`;
    }
  });

  // Gestione Invio Form
  document.getElementById('incidentForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const formData = {
      referenceNumber: document.getElementById('referenceNumber').value,
      dateOriginalIssue: document.getElementById('dateOriginalIssue').value,
      dateProbableClosing: document.getElementById('dateProbableClosing').value,
      dateResolved: document.getElementById('dateResolved').value,
      cinema: document.getElementById('selectCinema').value,
      nScreens: document.getElementById('nScreens').value,
      cinemaCapacity: document.getElementById('cinemaCapacity').value,
      area: document.getElementById('area').value,
      responsibility: document.getElementById('selectResponsibility').value,
      screen: document.getElementById('selectScreen').value,
      screenCapacity: document.getElementById('screenCapacity').value,
      reason: document.getElementById('selectReason').value,
      screenStatus: document.getElementById('screenStatus').value,
      comments: document.getElementById('comments').value,
      sessionsLost: document.getElementById('sessionsLost').value,
      totalRefunds: document.getElementById('totalRefunds').value,
      totalComplimentary: document.getElementById('totalComplimentary').value,
      descriptionClosure: document.getElementById('descriptionClosure').value,
      compiler: document.getElementById('compiler').value
    };

    console.log("Incident Report Registrato:", formData);
    alert("Incident Report salvato con successo!\nCodice: " + formData.referenceNumber);
  });

  window.addEventListener('DOMContentLoaded', loadOptions);
</script>
