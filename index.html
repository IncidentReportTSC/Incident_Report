<script>
    // INCOLLA QUI IL TUO NUOVO URL APPLICWEB APPENA GENERATO
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzqGPvgJBNrAsBh51d7KQDmnm6RoyCLpefs4lVS4-BDFt-RhVKYYD9i-DJvOZpUoHo/exec";

    let currentUser = null;

    // Carica la lista degli utenti dal JSON restituito da Google
    async function caricaListaUtenti() {
      const selectUser = document.getElementById('loginUser');
      try {
        const response = await fetch(SCRIPT_URL);
        const data = await response.json();
        
        selectUser.innerHTML = '<option value="">-- Seleziona Utente / Cinema --</option>';
        if (data.users && data.users.length > 0) {
          data.users.forEach(user => {
            const opt = document.createElement('option');
            opt.value = user;
            opt.textContent = user;
            selectUser.appendChild(opt);
          });
        }
      } catch (err) {
        console.error("Errore nel caricamento utenti:", err);
        selectUser.innerHTML = '<option value="">Errore nel caricamento utenti</option>';
      }
    }

    // Toggle Occhio Password
    function togglePasswordVisibility() {
      const passInput = document.getElementById('loginPass');
      const toggleIcon = document.querySelector('.toggle-password');
      
      if (passInput.type === 'password') {
        passInput.type = 'text';
        toggleIcon.textContent = '🙈';
      } else {
        passInput.type = 'password';
        toggleIcon.textContent = '👁️';
      }
    }

    // Esegui Login via API POST
    async function eseguiLogin() {
      const user = document.getElementById('loginUser').value;
      const pass = document.getElementById('loginPass').value;
      const msgEl = document.getElementById('loginMessage');
      const btn = document.getElementById('btnLogin');

      if (!user) {
        msgEl.style.color = 'red';
        msgEl.textContent = 'Seleziona un utente dal menu.';
        return;
      }

      msgEl.style.color = '#0d6efd';
      msgEl.textContent = 'Verifica in corso...';
      btn.disabled = true;

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            action: 'login',
            username: user,
            password: pass
          })
        });

        const res = await response.json();

        if (res.success) {
          currentUser = res;
          msgEl.style.color = 'green';
          msgEl.textContent = 'Accesso riuscito!';
          
          setTimeout(() => {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('appSection').classList.remove('hidden');
            document.getElementById('lblUtente').textContent = currentUser.username;
            document.getElementById('lblRuolo').textContent = currentUser.ruolo;
          }, 600);

        } else {
          msgEl.style.color = 'red';
          msgEl.textContent = res.message || 'Username o Password errati.';
        }
      } catch (error) {
        console.error("Errore login:", error);
        msgEl.style.color = 'red';
        msgEl.textContent = 'Errore di connessione. Riprova.';
      } finally {
        btn.disabled = false;
      }
    }

    function logout() {
      currentUser = null;
      document.getElementById('appSection').classList.add('hidden');
      document.getElementById('loginSection').classList.remove('hidden');
      document.getElementById('loginPass').value = '';
      document.getElementById('loginMessage').textContent = '';
    }

    // Inizializzazione al caricamento
    document.addEventListener('DOMContentLoaded', () => {
      caricaListaUtenti();
    });
  </script>
