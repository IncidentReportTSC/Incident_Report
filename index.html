<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinema Incident Report</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .card {
      border: none;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      margin-bottom: 2rem;
    }
    .card-header {
      background-color: #0d6efd;
      color: white;
      font-weight: 600;
    }
    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #0d6efd;
      border-bottom: 2px solid #e9ecef;
      padding-bottom: 0.5rem;
      margin-bottom: 1rem;
    }
    .status-open {
      background-color: #d1e7dd !important;
      color: #0f5132 !important;
      font-weight: bold;
    }
    .status-close {
      background-color: #f8d7da !important;
      color: #842029 !important;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container py-4">
    <div class="card">
      <div class="card-header text-center py-3">
        <h3 class="mb-0">📹 Cinema Incident Report</h3>
      </div>
      <div class="card-body p-4">
        
        <form id="incidentForm">
          
          <!-- SEZIONE 1: INFO GENERALI -->
          <div class="section-title">1. Informazioni Generali</div>
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label for="referenceNumber" class="form-label">Reference Number</label>
              <input type="text" class="form-control" id="referenceNumber" placeholder="Es. INC-2026-001" required>
            </div>
            <div class="col-md-6">
              <label for="compiler" class="form-label">Compilatore (Nome / Email)</label>
              <input type="text" class="form-control" id="compiler" placeholder="Il tuo nome" required>
            </div>
          </div>

          <!-- SEZIONE 2: DATE -->
          <div class="section-title">2. Date dell'Evento</div>
          <div class="row g-3 mb-4">
            <div class="col-md-4">
              <label for="dateOriginalIssue" class="form-label">Data Inizio Guasto</label>
              <input type="date" class="form-control" id="dateOriginalIssue" required>
            </div>
            <div class="col-md-4">
              <label for="dateProbableClosing" class="form-label">Data Chiusura Prevista</label>
              <input type="date" class="form-control" id="dateProbableClosing">
            </div>
            <div class="col-md-4">
              <label for="dateResolved" class="form-label">Data Risoluzione Effettiva</label>
              <input type="date" class="form-control" id="dateResolved">
            </div>
          </div>

          <!-- SEZIONE 3: CINEMA E RESPONSABILITÀ -->
          <div class="section-title">3. Dettagli Struttura</div>
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label for="cinema" class="form-label">Cinema</label>
              <select class="form-select" id="cinema" required onchange="handleCinemaChange()">
                <option value="">Caricamento cinema in corso...</option>
              </select>
            </div>
            <div class="col-md-2">
              <label for="nScreens" class="form-label">N. Sale Totali</label>
              <input type="number" class="form-control" id="nScreens" readonly>
            </div>
            <div class="col-md-2">
              <label for="cinemaCapacity" class="form-label">Capienza Cinema</label>
              <input type="number" class="form-control" id="cinemaCapacity" readonly>
            </div>
            <div class="col-md-2">
              <label for="area" class="form-label">Area</label>
              <input type="text" class="form-control" id="area" readonly>
            </div>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label for="responsibility" class="form-label">Responsabilità</label>
              <select class="form-select" id="responsibility" required>
                <option value="">Seleziona responsabilità...</option>
              </select>
            </div>
            <div class="col-md-6">
              <label for="reason" class="form-label">Motivazione / Categoria Guasto</label>
              <select class="form-select" id="reason" required>
                <option value="">Seleziona motivazione...</option>
              </select>
            </div>
          </div>

          <!-- SEZIONE 4: SALA E STATO -->
          <div class="section-title">4. Dettagli Sala Impattata</div>
          <div class="row g-3 mb-4">
            <div class="col-md-4">
              <label for="screen" class="form-label">Numero Sala Impattata</label>
              <input type="text" class="form-control" id="screen" placeholder="Es. Sala 3" required>
            </div>
            <div class="col-md-4">
              <label for="screenCapacity" class="form-label">Capienza Sala Impattata</label>
              <input type="number" class="form-control" id="screenCapacity" placeholder="Es. 150">
            </div>
            <div class="col-md-4">
              <label for="screenStatus" class="form-label">Stato Sala</label>
              <select class="form-select" id="screenStatus" onchange="updateStatusColor(this)" required>
                <option value="Open">Open (Aperta)</option>
                <option value="Close">Close (Chiusa)</option>
              </select>
            </div>
          </div>

          <!-- SEZIONE 5: IMPATTO ECONOMICO E SPETTACOLI -->
          <div class="section-title">5. Impatto Operativo ed Economico</div>
          <div class="row g-3 mb-4">
            <div class="col-md-4">
              <label for="sessionsLost" class="form-label">Spettacoli Persi</label>
              <select class="form-select" id="sessionsLost">
                <option value="">Seleziona...</option>
              </select>
            </div>
            <div class="col-md-4">
              <label for="totalRefunds" class="form-label">Totale Rimborsi (€)</label>
              <input type="number" step="0.01" class="form-control" id="totalRefunds" placeholder="0.00">
            </div>
            <div class="col-md-4">
              <label for="totalComplimentary" class="form-label">Totale Biglietti Omaggio</label>
              <input type="number" class="form-control" id="totalComplimentary" placeholder="0">
            </div>
          </div>

          <!-- SEZIONE 6: NOTE E DESCRIZIONI -->
          <div class="section-title">6. Note e Descrizione</div>
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label for="comments" class="form-label">Commenti / Note</label>
              <textarea class="form-control" id="comments" rows="3" placeholder="Dettagli generali sul guasto..."></textarea>
            </div>
            <div class="col-md-6">
              <label for="descriptionClosure" class="form-label">Descrizione Chiusura / Risoluzione</label>
              <textarea class="form-control" id="descriptionClosure" rows="3" placeholder="Azioni intraprese per la risoluzione..."></textarea>
            </div>
          </div>

          <!-- PULSANTE INVIO -->
          <div class="d-grid gap-2 d-md-flex justify-content-md-end">
            <button type="submit" class="btn btn-primary btn-lg px-5" id="submitBtn">
              💾 Salva Report
            </button>
          </div>

        </form>

      </div>
    </div>
  </div>

  <!-- SCRIPT LOGICO -->
  <script>
    // URL di Google Apps Script integrato
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyjwGLowrw4e7yBxayDH6jfp1f5laatjeclog-tOZPW1RHu5iamvgu03i4J6ZUXa80/exec";

    let appOptions = {};

    function updateStatusColor(selectElement) {
      if (!selectElement) return;
      if (selectElement.value === 'Close') {
        selectElement.className = 'form-select status-close';
      } else {
        selectElement.className = 'form-select status-open';
      }
    }

    async function loadOptions() {
      try {
        const response = await fetch(SCRIPT_URL);
        appOptions = await response.json();
        initFormOptions();
      } catch (error) {
        console.error("Errore nel caricamento delle opzioni:", error);
        alert("Impossibile caricare le opzioni dal server. Verifica la connessione o l'URL.");
      }
    }

    function initFormOptions() {
      // Popola Cinema
      const cinemaSelect = document.getElementById('cinema');
      cinemaSelect.innerHTML = '<option value="">Seleziona cinema...</option>';
      if (appOptions.cinemas) {
        appOptions.cinemas.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.name;
          opt.textContent = c.name;
          cinemaSelect.appendChild(opt);
        });
      }

      // Popola Responsabilità
      const respSelect = document.getElementById('responsibility');
      respSelect.innerHTML = '<option value="">Seleziona responsabilità...</option>';
      if (appOptions.responsibilities) {
        appOptions.responsibilities.forEach(r => {
          const opt = document.createElement('option');
          opt.value = r;
          opt.textContent = r;
          respSelect.appendChild(opt);
        });
      }

      // Popola Motivazioni
      const reasonSelect = document.getElementById('reason');
      reasonSelect.innerHTML = '<option value="">Seleziona motivazione...</option>';
      if (appOptions.reasons) {
        appOptions.reasons.forEach(r => {
          const opt = document.createElement('option');
          opt.value = r;
          opt.textContent = r;
          reasonSelect.appendChild(opt);
        });
      }

      // Popola Spettacoli Persi
      const sessionsSelect = document.getElementById('sessionsLost');
      sessionsSelect.innerHTML = '<option value="">Seleziona...</option>';
      if (appOptions.sessions_lost) {
        appOptions.sessions_lost.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s;
          opt.textContent = s;
          sessionsSelect.appendChild(opt);
        });
      }
    }

    function handleCinemaChange() {
      const selectedName = document.getElementById('cinema').value;
      const cinemaObj = appOptions.cinemas ? appOptions.cinemas.find(c => c.name === selectedName) : null;
      
      if (cinemaObj) {
        document.getElementById('nScreens').value = cinemaObj.screens || '';
        document.getElementById('cinemaCapacity').value = cinemaObj.capacity || '';
        document.getElementById('area').value = cinemaObj.area || '';
      } else {
        document.getElementById('nScreens').value = '';
        document.getElementById('cinemaCapacity').value = '';
        document.getElementById('area').value = '';
      }
    }

    document.getElementById('incidentForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Salvataggio...';

      const formData = {
        referenceNumber: document.getElementById('referenceNumber').value,
        compiler: document.getElementById('compiler').value,
        dateOriginalIssue: document.getElementById('dateOriginalIssue').value,
        dateProbableClosing: document.getElementById('dateProbableClosing').value,
        dateResolved: document.getElementById('dateResolved').value,
        cinema: document.getElementById('cinema').value,
        nScreens: document.getElementById('nScreens').value,
        cinemaCapacity: document.getElementById('cinemaCapacity').value,
        area: document.getElementById('area').value,
        responsibility: document.getElementById('responsibility').value,
        reason: document.getElementById('reason').value,
        screen: document.getElementById('screen').value,
        screenCapacity: document.getElementById('screenCapacity').value,
        screenStatus: document.getElementById('screenStatus').value,
        sessionsLost: document.getElementById('sessionsLost').value,
        totalRefunds: document.getElementById('totalRefunds').value,
        totalComplimentary: document.getElementById('totalComplimentary').value,
        comments: document.getElementById('comments').value,
        descriptionClosure: document.getElementById('descriptionClosure').value
      };

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        });

        alert('✅ Incident Report salvato con successo sul Foglio Google!');
        document.getElementById('incidentForm').reset();
        updateStatusColor(document.getElementById('screenStatus'));
      } catch (error) {
        console.error('Errore durante l\'invio:', error);
        alert('❌ Errore durante il salvataggio. Riprova.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '💾 Salva Report';
      }
    });

    // Inizializzazione al caricamento
    document.addEventListener('DOMContentLoaded', () => {
      loadOptions();
      updateStatusColor(document.getElementById('screenStatus'));
    });
  </script>
</body>
</html>
